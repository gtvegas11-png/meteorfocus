<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeteoFocus Terminal Dashboard</title>
<!-- Tailwind CSS for high-density styling -->
<script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-[#00ff66] font-mono min-h-screen p-6">
<div class="max-w-6xl mx-auto">
<!-- HEADER MODULE -->
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b-2 border-slate-800 pb-4 mb-6">
<div>
<h1 class="text-xl font-bold tracking-wider text-white">AMER_COMMODITY_WEATHER_TERMINAL</h1>
<p class="text-xs text-slate-500 mt-1">MeteoFocus Institutional Alpha Engine // Active Simulation</p>
</div>
<div class="mt-2 sm:mt-0 px-3 py-1 bg-slate-800 text-xs rounded border border-slate-700 text-[#00ff66]">
LIVE MONITOR ACTIVE
</div>
</div>

<!-- GRID TILES -->
<h2 class="text-slate-400 text-xs uppercase tracking-widest mb-4">Active Hub Asset Projections</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="grid-container">
<!-- Tiles dynamically injected here -->
</div>

<!-- TICKER LOGS -->
<h2 class="text-slate-400 text-xs uppercase tracking-widest mb-4">Real-Time Signal Execution Logs (Auto-Scraping NOAA Data)</h2>
<div class="bg-[#111827] border border-slate-800 rounded-lg p-4 h-[300px] overflow-y-auto" id="log-container">
<div class="text-slate-600 text-xs text-center py-8" id="empty-msg">Awaiting initial structural mathematical adjustments from global weather model matrices...</div>
<div class="divide-y divide-slate-800" id="log-list"></div>
</div>
</div>

<script>
// Data Registry
const data = {
"ERCOT_TEXAS_GRID": { model: "ECMWF", run_id: "20261026_12Z", projected_dd: 54.5, prev_dd: 40.0 },
"PJM_NORTHEAST_GRID": { model: "GFS", run_id: "20261026_12Z", projected_dd: 12.2, prev_dd: 11.8 },
"MIDWEST_CROP_BELT": { model: "EURO_ENS", run_id: "20261026_12Z", projected_dd: 28.4, prev_dd: 31.2 }
};

function renderTiles() {
const container = document.getElementById('grid-container');
container.innerHTML = '';

Object.entries(data).forEach(([region, item]) => {
const delta = Math.round((item.projected_dd - item.prev_dd) * 10) / 10;
const deltaColor = delta >= 2 ? 'text-emerald-400' : delta <= -2 ? 'text-rose-400' : 'text-slate-400';
const deltaSign = delta >= 0 ? `+${delta.toFixed(1)}` : delta.toFixed(1);

container.innerHTML += `
<div class="bg-[#111827] border border-slate-800 p-5 rounded-lg">
<div class="text-[10px] text-slate-500">RUN: ${item.run_id} | PLATFORM: ${item.model}</div>
<div class="text-base font-bold my-1 text-slate-200">${region.replace(/_/g, " ")}</div>
<div class="flex justify-between items-end mt-4">
<div>
<div class="text-[10px] text-slate-500">PROJECTED DEGREE DAYS</div>
<div class="text-3xl text-white font-bold tracking-tight">${item.projected_dd.toFixed(1)}</div>
</div>
<div class="text-right">
<div class="text-[10px] text-slate-500">6HR GRID SHIFT</div>
<div class="text-xl font-bold ${deltaColor}">${deltaSign}</div>
</div>
</div>
</div>
`;
});
}

function addLog(region, model, shift) {
document.getElementById('empty-msg').style.display = 'none';
const logList = document.getElementById('log-list');
const priority = Math.abs(shift) >= 4.5 ? "HIGH" : "MEDIUM";
const badgeColor = priority === 'HIGH' ? 'bg-rose-950 text-rose-400 border-rose-800' : 'bg-amber-950 text-amber-400 border-amber-800';
const shiftColor = shift > 0 ? 'text-emerald-400' : 'text-rose-400';
const shiftSign = shift > 0 ? `+${shift.toFixed(1)}` : shift.toFixed(1);
const time = new Date().toLocaleTimeString();

const logHTML = `
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-3 text-xs gap-2">
<div>
<span class="mr-2 font-bold px-1.5 py-0.5 rounded text-[10px] border ${badgeColor}">${priority} FLIP</span>
<span class="text-slate-200 font-bold">${region.replace(/_/g, " ")}</span>
<span class="text-slate-400"> runs updated. Shift vector identified at </span>
<span class="font-bold ${shiftColor}">${shiftSign} DD</span>
</div>
<div class="text-slate-600 text-[10px]">${time}</div>
</div>
`;
logList.insertAdjacentHTML('afterbegin', logHTML);
}

// Live Market Simulator
setInterval(() => {
const regions = Object.keys(data);
const randomRegion = regions[Math.floor(Math.random() * regions.length)];
const target = data[randomRegion];

const oldVal = target.projected_dd;
const shift = Math.round((Math.random() * 12 - 6) * 10) / 10;
const newVal = Math.max(0, oldVal + shift);

target.projected_dd = newVal;
target.prev_dd = oldVal;

if (Math.abs(shift) >= 2.0) {
addLog(randomRegion, target.model, shift);
}
renderTiles();
}, 4000);

// Initial Build
renderTiles();
</script>
</body>
</html>
